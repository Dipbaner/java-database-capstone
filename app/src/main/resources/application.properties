spring.application.name=back-end

spring.datasource.url=jdbc:mysql://localhost:3306/clinic_system
spring.datasource.username=root

spring.datasource.password=dip220804
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false


spring.data.mongodb.uri=mongodb://localhost:27017/clinic_prescriptions


# With authentication:

# JWT Configuration
# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=900000
# 900000 ms = 15 minutes

# Optional: refresh token lifetime (7 days)
jwt.refresh-expiration-ms=604800000

spring.web.resources.static-locations=classpath:/static/

# -------------------------
# Thymeleaf Configuration
# -------------------------
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML

spring.thymeleaf.encoding=UTF-8