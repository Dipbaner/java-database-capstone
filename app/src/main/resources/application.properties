spring.application.name=back-end
server.port=${PORT:8080}

# MySQL (Aiven)
spring.datasource.url=jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/defaultdb?sslMode=REQUIRED
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# MongoDB (Atlas)
spring.data.mongodb.uri=mongodb+srv://root:root@smartclinic.wiytmia.mongodb.net/prescriptions?retryWrites=true&w=majority

management.endpoint.health.show-details=always
management.health.db.enabled=true

api.path=/
jwt.secret=${JWT_SECRET}

spring.web.resources.static-locations=classpath:/static/

# Thymeleaf
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=true
spring.thymeleaf.encoding=UTF-8