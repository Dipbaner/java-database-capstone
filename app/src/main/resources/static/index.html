<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Select Role</title>

    <link rel="icon" type="image/png" href="/assets/images/logo/logo.png">

    <link rel="stylesheet" href="/assets/css/index.css">
    <link rel="stylesheet" href="/assets/css/style.css">

    <script src="/js/util.js" defer></script>
    <script src="/js/render.js" defer></script>
    <script src="/js/components/header.js" defer></script>
    <script src="/js/components/footer.js" defer></script>
</head>

<body>
<div class="container">
    <div class="wrapper">

        <div id="header"></div>

        <main class="main">
            <h2 class="heading">Select Your Role</h2>
            <div class="role-buttons">
                <button id="adminLogin" class="adminBtn" type="button">Admin</button>
                <button id="patientBtn" class="patientBtn" type="button">Patient</button>
                <button id="doctorLogin" class="doctorBtn" type="button">Doctor</button>
            </div>
        </main>

        <div id="footer"></div>
    </div>
</div>

<div id="modal" class="modal">
    <div class="modal-content">
        <span id="closeModal" class="close">&times;</span>
        <div id="modal-body"></div>
    </div>
</div>

<script type="module" src="/js/services/index.js"></script>
</body>
</html>
