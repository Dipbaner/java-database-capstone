name: Java Backend CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    # If your pom.xml is in a subfolder (for example "app"), set it here.
    # If pom.xml is in the repository root, delete this defaults block.
    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Compile the backend
        run: mvn -B clean compile

      - name: Package the application (skip tests)
        run: mvn -B package -DskipTests
